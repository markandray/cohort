name: Push to ECR

on:
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC — lets this workflow request a token from GitHub's OIDC provider
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 250621608913.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  push:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::250621608913:role/cohort-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ env.ECR_REGISTRY }}/cohort-server:${{ github.sha }},${{ env.ECR_REGISTRY }}/cohort-server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: ${{ env.ECR_REGISTRY }}/cohort-client:${{ github.sha }},${{ env.ECR_REGISTRY }}/cohort-client:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max