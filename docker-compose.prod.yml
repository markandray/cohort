name: cohort-prod

services:
  postgres:
    image: postgres:16
    container_name: cohort-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cohort_prod
    ports:
      - '5432:5432'
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cohort-redis-prod
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_prod_data:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cohort-server-prod
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cohort_prod
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '5000:5000'

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
    container_name: cohort-client-prod
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '3000:3000'

volumes:
  postgres_prod_data:
  redis_prod_data: